<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canteen Debt Book</title>

<style>
body{
    font-family: Arial;
    background:#ffe6f0;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    color:#0066ff;
    margin-bottom:20px;
}

/* INPUT BOX */
.box{
    background:white;
    width:420px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    text-align:left;
}

.box h2{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

button.add{
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

/* CARD LIST */
.card{
    background:white;
    width:420px;
    margin:15px auto;
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    text-align:left;
    border-left:6px solid #0066ff;
    position:relative;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.debt{
    margin-top:5px;
    font-weight:bold;
}

/* WARNING */
.warning{
    color:red;
    font-size:13px;
    margin-top:5px;
}

/* BUTTONS */
.btn{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

.paid{
    background:#00b894;
}

.delete{
    background:#ff4d4d;
}

.right{
    position:absolute;
    right:15px;
    top:15px;
}
</style>
</head>

<body>

<h1>📒 Canteen Debt Book</h1>

<div class="box">
    <h2>Add Debt</h2>
    <input id="name" placeholder="Enter customer name">
    <input id="amount" type="number" placeholder="Enter debt amount">
    <button class="add" onclick="addDebt()">Add Debt</button>
</div>

<div id="list"></div>

<script>
let debts = JSON.parse(localStorage.getItem("debts")) || {};

function save(){
    localStorage.setItem("debts", JSON.stringify(debts));
}

/* 🔊 VOICE */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(msg);
}

/* 🚨 WARNING VOICE */
function warningVoice(){
    let msg = new SpeechSynthesisUtterance("Warning: Buyer’s debt is over the limit");
    speechSynthesis.speak(msg);
}

/* ADD DEBT */
function addDebt(){
    let name = document.getElementById("name").value.trim();
    let amount = parseFloat(document.getElementById("amount").value);

    if(!name || isNaN(amount)) return;

    if(debts[name]){
        debts[name] += amount;
    } else {
        debts[name] = amount;
    }

    save();
    speak(name + " owes RM " + debts[name]);

    if(debts[name] >= 50){
        warningVoice();
    }

    render();

    document.getElementById("name").value="";
    document.getElementById("amount").value="";
}

/* PAID */
function markPaid(name){
    delete debts[name];
    save();
    render();
}

/* DELETE */
function deleteDebt(name){
    delete debts[name];
    save();
    render();
}

/* DISPLAY */
function render(){
    let list = document.getElementById("list");
    list.innerHTML = "";

    for(let name in debts){

        let warn = debts[name] >= 50 ? 
        `<div class="warning">⚠ Debt Over Limit!</div>` : "";

        list.innerHTML += `
        <div class="card">
            <div class="name">${name}</div>
            <div class="debt">Debt: RM${debts[name].toFixed(2)}</div>
            ${warn}

            <div class="right">
                <button class="btn paid" onclick="markPaid('${name}')">Paid</button>
                <button class="btn delete" onclick="deleteDebt('${name}')">Delete</button>
            </div>
        </div>
        `;
    }
}

render();
</script>

</body>
</html>
